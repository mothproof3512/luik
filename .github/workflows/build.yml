name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Luik.app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build app bundle
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Luik.app Luik.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luik.app
          path: Luik.app.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Luik.app.zip
          generate_release_notes: true
          body: |
            Built by GitHub Actions. The app is not notarized; after downloading, run once:

            ```
            xattr -dr com.apple.quarantine /Applications/Luik.app
            ```
